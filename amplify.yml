version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Set Node.js to v22.12.0 (LTS) first
            - nvm install 22.12.0
            - nvm use 22.12.0
            
            # Clean install with legacy peer deps
            - rm -rf node_modules package-lock.json
            - npm install --legacy-peer-deps
            
            # Install Vite and React plugin with compatible versions
            - npm install --save-dev vite@latest @vitejs/plugin-react@latest --legacy-peer-deps
            
            # Install other dev dependencies
            - npm install --save-dev eslint@latest @eslint/js@latest globals@latest eslint-plugin-react-hooks@latest eslint-plugin-react-refresh@latest typescript-eslint@latest @typescript-eslint/eslint-plugin@latest @typescript-eslint/parser@latest
            
            # Verify installations
            - npm ls vite
            - npm ls @vitejs/plugin-react
            
        build:
          commands:
            - npm run build:prod
          env:
            VITE_API_BASE_URL: http://ec2-13-51-199-205.eu-north-1.compute.amazonaws.com:8080
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .vite/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: 'Strict-Transport-Security'
              value: 'max-age=31536000; includeSubDomains'
            - key: 'X-Frame-Options'
              value: 'DENY'