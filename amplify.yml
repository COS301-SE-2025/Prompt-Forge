version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - npm install -g npm@latest
            - rm -rf node_modules pnpm-lock.yaml .npmrc .vite
            - npm ci --legacy-peer-deps
            - npm ls vite typescript || echo "Dependencies check"
            - npx tsc --version
        build:
          commands:
            - npm run build:prod
          env:
            VITE_API_BASE_URL: http://ec2-13-51-199-205.eu-north-1.compute.amazonaws.com:8080
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*