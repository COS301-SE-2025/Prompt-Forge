# Enable Swagger UI (SpringDoc OpenAPI)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# Enable detailed logging for SpringDoc (OpenAPI/Swagger)
logging.level.org.springdoc=DEBUG

# Enable detailed logging for Spring Web
logging.level.org.springframework.web=DEBUG

# (Optional) log exceptions at root level
logging.level.root=INFO

# Logging format to ensure consistent output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Development profile for stricter validation
spring.profiles.active=dev

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security
jwt.secret=${JWT_SECRET}

# OpenRouter
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.base.url=${OPENROUTER_BASE_URL}