# Enable Swagger UI (SpringDoc OpenAPI)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# 🔍 Enable detailed logging for SpringDoc (OpenAPI/Swagger)
logging.level.org.springdoc=DEBUG

# 🔍 Enable detailed logging for Spring Web
logging.level.org.springframework.web=DEBUG

# 🔍 (Optional) log exceptions at root level
logging.level.root=INFO

# Logging format to ensure consistent output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Development profile for stricter validation
spring.profiles.active=dev

# Load from environment variable
paystack.secret-key=${PAYSTACK_SECRET_KEY}

