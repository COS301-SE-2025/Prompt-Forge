# Enable Swagger UI (SpringDoc OpenAPI)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# Enable detailed logging for SpringDoc (OpenAPI/Swagger)
logging.level.org.springdoc=DEBUG

# Enable detailed logging for Spring Web
logging.level.org.springframework.web=DEBUG

# (Optional) log exceptions at root level
logging.level.root=INFO


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Logging format to ensure consistent output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Development profile for stricter validation  
# Note: This will be overridden by SPRING_PROFILES_ACTIVE environment variable in production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# Load from environment variable
paystack.secret-key=${PAYSTACK_SECRET_KEY}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration (disabled for now)
spring.flyway.enabled=false

# Security
jwt.secret=${JWT_SECRET}

# OpenRouter
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.base.url=${OPENROUTER_BASE_URL}

aws.s3.bucket-name=${AWS_S3_BUCKET}
aws.region=${AWS_REGION}
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}

# AI and ML Services (Docker service names for container environments)
ai.service.url=${AI_SERVICE_URL:http://ai-service:8000}
ml.service.url=${ML_SERVICE_URL:http://ml-service:8001}

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}

# SMTP / Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Encryption Configuration
app.encryption.key=${ENCRYPTION_KEY}

