spring.profiles.active=prod

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Security
jwt.secret=${JWT_SECRET}

# OpenRouter
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.base.url=${OPENROUTER_BASE_URL}

# Hugging Face
huggingface.token=${HF_TOKEN}

# AI and ML Services (Docker internal URLs)
ai.service.url=http://ai-service:8000
ml.service.url=http://ml-service:8001

# Server
server.port=8080

# CORS - Update with your Amplify domain
cors.allowed-origins=https://prompt-forge.co.za,https://localhost:5173