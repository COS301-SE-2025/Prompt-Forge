name: CD [Deploy to Production]

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-node-
        
    - name: Run backend tests
      env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-north-1
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      run: |
        cd backend/project
        chmod +x ./mvnw
        ./mvnw clean test -Dcheckstyle.skip=true
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install --save-dev \
          eslint@latest \
          @eslint/js@latest \
          globals@latest \
          eslint-plugin-react-hooks@latest \
          eslint-plugin-react-refresh@latest \
          typescript-eslint@latest \
          @typescript-eslint/eslint-plugin@latest \
          @typescript-eslint/parser@latest
        npm install
        
    - name: Run frontend tests
      run: |
        cd frontend
        npm run test:ci
        
    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint

  build-backend:
    name: Build Backend
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build backend
      run: |
        cd backend/project
        chmod +x ./mvnw
        ./mvnw clean package -DskipTests -Dcheckstyle.skip=true
        
    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: backend/project/target/*.jar
        retention-days: 1

  deploy-backend:
    name: Deploy Backend to EC2 (Bulletproof AI/ML Protection)
    needs: [build-backend]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-jar
        path: ./artifacts/
        
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        
    - name: Test SSH connection
      run: |
        ssh -i ~/.ssh/id_rsa -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST }} "echo 'SSH connection successful'"
        
    - name: Copy files to EC2
      run: |
        scp -i ~/.ssh/id_rsa -o ConnectTimeout=10 -o StrictHostKeyChecking=no ./artifacts/*.jar ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/
        scp -i ~/.ssh/id_rsa -o ConnectTimeout=10 -o StrictHostKeyChecking=no nginx.conf ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/
        
    - name: Deploy to EC2 (Bulletproof Protection Mode)
      run: |
        ssh -i ~/.ssh/id_rsa -o ConnectTimeout=10 -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          echo "=== BULLETPROOF AI/ML SERVICE PROTECTION ==="
          
          # 1. VERIFY SYSTEMD SERVICES ARE RUNNING
          AI_SYSTEMD_ACTIVE=$(sudo systemctl is-active prompt-forge-ai.service 2>/dev/null || echo "inactive")
          ML_SYSTEMD_ACTIVE=$(sudo systemctl is-active prompt-forge-ml.service 2>/dev/null || echo "inactive")
          
          echo "AI Service (systemd): $AI_SYSTEMD_ACTIVE"
          echo "ML Service (systemd): $ML_SYSTEMD_ACTIVE"
          
          # 2. BACKUP CURRENT SERVICE STATES
          ps aux | grep -E "(ai_service_production|prompt\.py)" | grep -v grep > /tmp/python_services_backup.txt
          
          # 3. PREVENT ANY DOCKER INTERFERENCE
          echo "Ensuring no Docker containers can bind to AI/ML ports..."
          sudo docker stop $(sudo docker ps -q --filter "publish=8000" --filter "publish=8001") 2>/dev/null || true
          
          # 4. CHECK IF MANUAL PYTHON SERVICES ARE RUNNING
          AI_SERVICE_PID=$(pgrep -f "ai_service_production.py" || echo "")
          ML_SERVICE_PID=$(pgrep -f "prompt.py" || echo "")
          
          if [ ! -z "$AI_SERVICE_PID" ] && [ ! -z "$ML_SERVICE_PID" ]; then
            echo "PROTECTION ACTIVE: Manual Python services detected and will be preserved:"
            echo "   AI Service PID: $AI_SERVICE_PID (Port 8000)"
            echo "   ML Service PID: $ML_SERVICE_PID (Port 8001)"
            
            # Create a deployment lock file
            echo "PROTECTED_AI_PID=$AI_SERVICE_PID" > /tmp/deployment_protection.lock
            echo "PROTECTED_ML_PID=$ML_SERVICE_PID" >> /tmp/deployment_protection.lock
            echo "DEPLOYMENT_TIMESTAMP=$(date)" >> /tmp/deployment_protection.lock
            
            PRESERVE_PYTHON_SERVICES=true
          else
            echo "WARNING: Manual Python services not detected"
            PRESERVE_PYTHON_SERVICES=false
          fi
          
          echo "=== STOPPING ONLY JAVA BACKEND (PROTECTED MODE) ==="
          
          # Stop only Java backend with extra safety
          sudo systemctl stop prompt-forge-backend 2>/dev/null || true
          
          # Find and stop Java processes, but verify we're not killing Python
          for pid in $(pgrep -f "project-0.0.1-SNAPSHOT.jar" || echo ""); do
            if [ ! -z "$pid" ]; then
              # Double-check this is actually a Java process
              process_cmd=$(ps -p $pid -o cmd --no-headers 2>/dev/null || echo "")
              if [[ "$process_cmd" == *"java"* && "$process_cmd" == *".jar"* ]]; then
                echo "Stopping Java backend (PID: $pid)..."
                kill $pid || true
              else
                echo "Skipping PID $pid - not a Java backend process"
              fi
            fi
          done
          
          # Wait longer for clean shutdown
          sleep 10
          
          # 5. VERIFY PYTHON SERVICES ARE STILL RUNNING
          if [ "$PRESERVE_PYTHON_SERVICES" = "true" ]; then
            echo "=== VERIFYING AI/ML SERVICES SURVIVED ==="
            
            if pgrep -f "ai_service_production.py" > /dev/null; then
              echo "AI Service: PROTECTED and RUNNING"
            else
              echo "AI Service: PROTECTION FAILED - attempting restart..."
              sudo systemctl start prompt-forge-ai.service || true
            fi
            
            if pgrep -f "prompt.py" > /dev/null; then
              echo "ML Service: PROTECTED and RUNNING"
            else
              echo "ML Service: PROTECTION FAILED - attempting restart..."
              sudo systemctl start prompt-forge-ml.service || true
            fi
          fi
          
          # Stop any Docker containers that might interfere
          sudo docker-compose -f docker-compose.prod.yml down 2>/dev/null || true
          
          # 6. ENSURE NO DOCKER SERVICES ON AI/ML PORTS
          echo "=== PREVENTING DOCKER PORT CONFLICTS ==="
          
          # Remove any Docker networks or containers that might claim these ports
          sudo docker network prune -f 2>/dev/null || true
          sudo docker container prune -f 2>/dev/null || true
          
          echo "=== STARTING JAVA BACKEND (PROTECTED MODE WITH FIXED ENVIRONMENT) ==="
          
          # Find the new JAR file
          NEW_JAR=$(ls -t project-*.jar 2>/dev/null | head -1)
          if [ -z "$NEW_JAR" ]; then
            echo "ERROR: No JAR file found"
            exit 1
          fi
          
          echo "Starting new Java backend with environment variables: $NEW_JAR"
          
          # Start Java backend with all environment variables properly set
          nohup env \
            DB_URL='${{ secrets.DB_URL }}' \
            DB_USER='${{ secrets.DB_USER }}' \
            DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            OPENROUTER_API_KEY='${{ secrets.OPENROUTER_API_KEY }}' \
            OPENROUTER_BASE_URL='${{ secrets.OPENROUTER_BASE_URL }}' \
            HF_TOKEN='${{ secrets.HF_TOKEN }}' \
            PAYSTACK_SECRET_KEY='${{ secrets.PAYSTACK_SECRET_KEY }}' \
            AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
            AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
            AWS_S3_BUCKET='${{ secrets.AWS_S3_BUCKET }}' \
            AWS_REGION='eu-north-1' \
            AI_SERVICE_URL='http://localhost:8000' \
            ML_SERVICE_URL='http://localhost:8001' \
            SPRING_PROFILES_ACTIVE='prod' \
            SERVER_PORT='8080' \
            SERVER_ADDRESS='0.0.0.0' \
            java -jar \
              -Dspring.profiles.active=prod \
              -Dai.service.url=http://localhost:8000 \
              -Dml.service.url=http://localhost:8001 \
              -Dpython.services.protected=true \
              -Ddeployment.mode=manual_services_protected \
              -Dserver.port=8080 \
              -Dserver.address=0.0.0.0 \
              -Dmanagement.endpoints.web.exposure.include=health,info \
              -Dmanagement.endpoint.health.show-details=always \
              "$NEW_JAR" > java_backend.log 2>&1 &
          
          JAVA_PID=$!
          echo "Java backend started with PID: $JAVA_PID (PROTECTED MODE)"
          
          # Record the new Java PID
          echo "NEW_JAVA_PID=$JAVA_PID" >> /tmp/deployment_protection.lock
          
          echo "=== FINAL VERIFICATION (BULLETPROOF CHECK) ==="
          
          # Extended wait for services to stabilize (increased from 45 to 90 seconds)
          sleep 90
          
          # Comprehensive service verification
          echo "=== SERVICE STATUS VERIFICATION ==="
          
          AI_RUNNING=false
          ML_RUNNING=false
          JAVA_RUNNING=false
          
          if pgrep -f "ai_service_production.py" > /dev/null; then
            echo "AI Service (Manual): RUNNING on port 8000"
            AI_RUNNING=true
          else
            echo "AI Service: NOT RUNNING"
          fi
          
          if pgrep -f "prompt.py" > /dev/null; then
            echo "ML Service (Manual): RUNNING on port 8001"
            ML_RUNNING=true
          else
            echo "ML Service: NOT RUNNING"
          fi
          
          if pgrep -f "project-.*\.jar" > /dev/null; then
            echo "Java Backend: RUNNING on port 8080"
            JAVA_RUNNING=true
          else
            echo "Java Backend: NOT RUNNING"
          fi
          
          # Test actual connectivity
          echo "=== CONNECTIVITY VERIFICATION ==="
          curl -s http://localhost:8000/health > /dev/null && echo "AI Service: RESPONDING" || echo "AI Service: NOT RESPONDING"
          curl -s http://localhost:8001/health > /dev/null && echo "ML Service: RESPONDING" || echo "ML Service: NOT RESPONDING"
          
          # Test Java backend with multiple endpoints and better retry logic
          JAVA_RESPONDING=false
          for attempt in {1..15}; do
            if curl -s -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Java Backend: RESPONDING (actuator/health)"
              JAVA_RESPONDING=true
              break
            elif curl -s -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "Java Backend: RESPONDING (/health)"
              JAVA_RESPONDING=true
              break
            elif curl -s -f http://localhost:8080/ > /dev/null 2>&1; then
              echo "Java Backend: RESPONDING (root)"
              JAVA_RESPONDING=true
              break
            else
              echo "Java Backend connectivity check attempt $attempt/15..."
              sleep 10
            fi
          done
          
          if [ "$JAVA_RESPONDING" = false ]; then
            echo "Java Backend: NOT RESPONDING after 15 attempts"
            echo "Java backend logs (last 30 lines):"
            tail -30 java_backend.log
            
            # Check if port is bound
            if sudo ss -tlnp | grep ":8080" > /dev/null; then
              echo "Port 8080 is bound - Java backend may still be initializing"
            else
              echo "Port 8080 is not bound - Java backend failed to start"
            fi
          fi
          
          # Update nginx configuration
          sudo cp nginx.conf /etc/nginx/sites-available/prompt-forge 2>/dev/null || true
          sudo ln -sf /etc/nginx/sites-available/prompt-forge /etc/nginx/sites-enabled/ 2>/dev/null || true
          sudo nginx -t && sudo systemctl reload nginx 2>/dev/null || echo "Nginx configuration update failed"
          
          echo "=== DEPLOYMENT COMPLETE (BULLETPROOF MODE) ==="
          
          if [ "$AI_RUNNING" = true ] && [ "$ML_RUNNING" = true ] && [ "$JAVA_RUNNING" = true ]; then
            echo "SUCCESS: All services running - Java backend updated while AI/ML services protected"
            echo "Service Summary:"
            echo "   AI Service: Protected and running (systemd managed)"
            echo "   ML Service: Protected and running (systemd managed)"  
            echo "   Java Backend: Updated and running with proper environment"
            echo "   Deployment Mode: Bulletproof Protection Active"
          else
            echo "WARNING: Some services may not be running correctly"
            echo "AI Service: $AI_RUNNING"
            echo "ML Service: $ML_RUNNING"
            echo "Java Backend: $JAVA_RUNNING"
            
            # Don't fail deployment if Java backend is slow to respond but process is running
            if [ "$AI_RUNNING" = true ] && [ "$ML_RUNNING" = true ] && [ "$JAVA_RUNNING" = true ]; then
              echo "All processes are running - Java backend may still be initializing"
              echo "Continuing with deployment..."
            else
              echo "Check the logs and service status manually"
            fi
          fi
          
          # Save deployment status
          echo "DEPLOYMENT_STATUS=SUCCESS" >> /tmp/deployment_protection.lock
          echo "SERVICES_PROTECTED=AI,ML" >> /tmp/deployment_protection.lock
        EOF

  deploy-frontend:
    name: Frontend Deployment (Handled by Amplify)
    needs: [test]
    runs-on: ubuntu-latest
    
    steps:
    - name: Frontend deployment info
      run: |
        echo "Frontend deployment is handled automatically by AWS Amplify"
        echo "Amplify will detect the push to main branch and deploy using amplify.yml configuration"
        echo "Monitor deployment at: https://console.aws.amazon.com/amplify/home"
        echo "Frontend will be available at: https://prompt-forge.co.za"

  health-check:
    name: Health Check (Protected Services)
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    
    steps:
    - name: Wait for services to start
      run: sleep 120
      
    - name: Setup SSH key for health checks
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      
    - name: Comprehensive health check
      run: |
        ssh -i ~/.ssh/id_rsa -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          echo "=== COMPREHENSIVE HEALTH CHECK ==="
          
          # Load deployment protection status
          if [ -f /tmp/deployment_protection.lock ]; then
            echo "Loading deployment protection status..."
            cat /tmp/deployment_protection.lock
          fi
          
          echo "=== SERVICE PROCESS VERIFICATION ==="
          
          # Check processes
          AI_PID=$(pgrep -f "ai_service_production.py" || echo "")
          ML_PID=$(pgrep -f "prompt.py" || echo "")
          JAVA_PID=$(pgrep -f "project-.*\.jar" || echo "")
          
          echo "AI Service PID: ${AI_PID:-NOT RUNNING}"
          echo "ML Service PID: ${ML_PID:-NOT RUNNING}"
          echo "Java Backend PID: ${JAVA_PID:-NOT RUNNING}"
          
          echo "=== SERVICE HEALTH TESTS ==="
          
          # Test AI service health with retries
          AI_HEALTHY=false
          for i in {1..5}; do
            if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "AI Service: HEALTHY (attempt $i)"
              AI_HEALTHY=true
              break
            else
              echo "AI Service health check failed, attempt $i/5"
              sleep 10
            fi
          done
          
          # Test ML service health with retries
          ML_HEALTHY=false
          for i in {1..5}; do
            if curl -s -f http://localhost:8001/health > /dev/null 2>&1; then
              echo "ML Service: HEALTHY (attempt $i)"
              ML_HEALTHY=true
              break
            else
              echo "ML Service health check failed, attempt $i/5"
              sleep 10
            fi
          done
          
          # Test Java backend health with improved endpoint detection and longer timeout
          JAVA_HEALTHY=false
          for i in {1..20}; do
            if curl -s -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Java Backend: HEALTHY via actuator (attempt $i)"
              JAVA_HEALTHY=true
              break
            elif curl -s -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "Java Backend: HEALTHY via /health (attempt $i)"
              JAVA_HEALTHY=true
              break
            elif curl -s -f http://localhost:8080/ > /dev/null 2>&1; then
              echo "Java Backend: HEALTHY via root (attempt $i)"
              JAVA_HEALTHY=true
              break
            else
              echo "Java Backend health check failed, attempt $i/20"
              sleep 15
            fi
          done
          
          echo "=== PORT STATUS ==="
          sudo ss -tlnp | grep -E ":800[0-8]" || echo "No services listening on ports 8000-8008"
          
          echo "=== SYSTEMD SERVICE STATUS ==="
          sudo systemctl is-active prompt-forge-ai.service 2>/dev/null && echo "AI systemd service: ACTIVE" || echo "AI systemd service: INACTIVE"
          sudo systemctl is-active prompt-forge-ml.service 2>/dev/null && echo "ML systemd service: ACTIVE" || echo "ML systemd service: INACTIVE"
          
          echo "=== FINAL HEALTH STATUS ==="
          
          if [ "$AI_HEALTHY" = true ] && [ "$ML_HEALTHY" = true ] && [ "$JAVA_HEALTHY" = true ]; then
            echo "OVERALL STATUS: HEALTHY"
            echo "All services are running and responding correctly"
            exit 0
          else
            echo "OVERALL STATUS: UNHEALTHY"
            echo "AI Service: $AI_HEALTHY"
            echo "ML Service: $ML_HEALTHY"
            echo "Java Backend: $JAVA_HEALTHY"
            
            # Show Java logs if backend is unhealthy
            if [ "$JAVA_HEALTHY" = false ]; then
              echo "=== JAVA BACKEND ERROR LOGS ==="
              tail -50 java_backend.log 2>/dev/null || echo "No Java backend logs found"
              
              # Additional debugging
              echo "=== JAVA PROCESS CHECK ==="
              if pgrep -f "project-.*\.jar" > /dev/null; then
                echo "Java process is running but not responding to HTTP requests"
                echo "This may be normal during Spring Boot initialization"
              else
                echo "Java process is not running - startup failed"
              fi
              
              echo "=== PORT 8080 STATUS ==="
              sudo ss -tlnp | grep ":8080" || echo "Port 8080 is not bound"
            fi
            
            exit 1
          fi
        EOF
        
    - name: Check external endpoints
      run: |
        echo "=== EXTERNAL ENDPOINT VERIFICATION ==="
        
        echo "Checking Java backend health..."
        for i in {1..15}; do
          if curl -f http://ec2-13-51-199-205.eu-north-1.compute.amazonaws.com:8080/actuator/health > /dev/null 2>&1; then
            echo "Java Backend is healthy externally (actuator)"
            break
          elif curl -f http://ec2-13-51-199-205.eu-north-1.compute.amazonaws.com:8080/health > /dev/null 2>&1; then
            echo "Java Backend is healthy externally (/health)"
            break
          elif curl -f http://ec2-13-51-199-205.eu-north-1.compute.amazonaws.com:8080/ > /dev/null 2>&1; then
            echo "Java Backend is healthy externally (root)"
            break
          else
            echo "External backend health check failed, attempt $i/15"
            sleep 20
          fi
        done
        
        echo "Checking AI service health..."
        for i in {1..5}; do
          if curl -f http://ec2-13-51-199-205.eu-north-1.compute.amazonaws.com:8000/health > /dev/null 2>&1; then
            echo "AI Service (Manual) is healthy externally"
            break
          else
            echo "External AI Service health check failed, attempt $i/5"
            sleep 10
          fi
        done
        
        echo "Checking ML service health..."
        for i in {1..5}; do
          if curl -f http://ec2-13-51-199-205.eu-north-1.compute.amazonaws.com:8001/health > /dev/null 2>&1; then
            echo "ML Service (Manual) is healthy externally"
            break
          else
            echo "External ML Service health check failed, attempt $i/5"
            sleep 10
          fi
        done
        
        echo "Checking frontend health..."
        for i in {1..20}; do
          if curl -f https://prompt-forge.co.za > /dev/null 2>&1; then
            echo "Frontend is accessible"
            break
          else
            echo "Frontend health check failed, attempt $i/20 (Amplify may still be deploying)"
            sleep 30
          fi
        done
        
    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "Java backend updated while preserving manual AI/ML services"
          echo ""
          echo "Service URLs:"
          echo "Frontend: https://prompt-forge.co.za"
          echo "Backend API: http://ec2-13-51-199-205.eu-north-1.compute.amazonaws.com:8080"
          echo "AI Service (Manual): http://ec2-13-51-199-205.eu-north-1.compute.amazonaws.com:8000"
          echo "ML Service (Manual): http://ec2-13-51-199-205.eu-north-1.compute.amazonaws.com:8001"
          echo ""
          echo "Deployment Mode: Bulletproof Protection Active"
          echo "Protected Services: AI Service, ML Service"
          echo "Updated Services: Java Backend only"
        else
          echo "DEPLOYMENT FAILED"
          echo "Manual AI/ML services should be preserved even on failure"
          echo "Check the logs for specific error details"
        fi

  rollback:
    name: Emergency Rollback (Preserve Protected Services)
    needs: [deploy-backend, deploy-frontend, health-check]
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        
    - name: Emergency rollback (Java backend only)
      run: |
        ssh -i ~/.ssh/id_rsa -o ConnectTimeout=10 -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          echo "=== EMERGENCY ROLLBACK: JAVA BACKEND ONLY ==="
          
          # Load protection status
          if [ -f /tmp/deployment_protection.lock ]; then
            echo "Loading deployment protection status..."
            source /tmp/deployment_protection.lock 2>/dev/null || true
          fi
          
          # Stop current Java backend
          JAVA_PID=$(pgrep -f "project-.*\.jar" || echo "")
          if [ ! -z "$JAVA_PID" ]; then
            echo "Stopping current Java backend (PID: $JAVA_PID)..."
            kill $JAVA_PID || true
            sleep 10
          fi
          
          # Verify AI/ML services are still protected
          echo "=== VERIFYING PROTECTED SERVICES ==="
          
          if pgrep -f "ai_service_production.py" > /dev/null; then
            echo "AI Service: PROTECTED and RUNNING during rollback"
          else
            echo "AI Service: NOT RUNNING - attempting emergency restart..."
            sudo systemctl start prompt-forge-ai.service || true
          fi
          
          if pgrep -f "prompt.py" > /dev/null; then
            echo "ML Service: PROTECTED and RUNNING during rollback"
          else
            echo "ML Service: NOT RUNNING - attempting emergency restart..."
            sudo systemctl start prompt-forge-ml.service || true
          fi
          
          # Try to start previous Java backend version with environment variables
          PREVIOUS_JAR=$(ls -t project-*.jar 2>/dev/null | tail -1)
          if [ ! -z "$PREVIOUS_JAR" ]; then
            echo "Rolling back to previous Java backend: $PREVIOUS_JAR"
            
            # Start rollback version with same environment setup
            nohup env \
              DB_URL='${{ secrets.DB_URL }}' \
              DB_USER='${{ secrets.DB_USER }}' \
              DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              OPENROUTER_API_KEY='${{ secrets.OPENROUTER_API_KEY }}' \
              OPENROUTER_BASE_URL='${{ secrets.OPENROUTER_BASE_URL }}' \
              HF_TOKEN='${{ secrets.HF_TOKEN }}' \
              PAYSTACK_SECRET_KEY='${{ secrets.PAYSTACK_SECRET_KEY }}' \
              AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
              AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
              AWS_S3_BUCKET='${{ secrets.AWS_S3_BUCKET }}' \
              AWS_REGION='eu-north-1' \
              AI_SERVICE_URL='http://localhost:8000' \
              ML_SERVICE_URL='http://localhost:8001' \
              SPRING_PROFILES_ACTIVE='prod' \
              java -jar \
                -Dspring.profiles.active=prod \
                -Dai.service.url=http://localhost:8000 \
                -Dml.service.url=http://localhost:8001 \
                -Dpython.services.protected=true \
                -Dserver.port=8080 \
                -Dserver.address=0.0.0.0 \
                "$PREVIOUS_JAR" > java_backend_rollback.log 2>&1 &
            
            echo "Rollback Java backend started with protection enabled"
          else
            echo "No previous Java backend version found for rollback"
          fi
          
          # Wait and verify rollback
          sleep 45
          
          echo "=== ROLLBACK VERIFICATION ==="
          
          if pgrep -f "ai_service_production.py" > /dev/null; then
            echo "AI Service: SURVIVING ROLLBACK"
          else
            echo "AI Service: FAILED TO SURVIVE ROLLBACK"
          fi
          
          if pgrep -f "prompt.py" > /dev/null; then
            echo "ML Service: SURVIVING ROLLBACK"
          else
            echo "ML Service: FAILED TO SURVIVE ROLLBACK"
          fi
          
          if pgrep -f "project-.*\.jar" > /dev/null; then
            echo "Java Backend: ROLLBACK SUCCESSFUL"
          else
            echo "Java Backend: ROLLBACK FAILED"
          fi
          
          # Record rollback status
          echo "ROLLBACK_TIMESTAMP=$(date)" >> /tmp/deployment_protection.lock
          echo "ROLLBACK_STATUS=EXECUTED" >> /tmp/deployment_protection.lock
        EOF
        
    - name: Notify rollback completion
      run: |
        echo "EMERGENCY ROLLBACK COMPLETED"
        echo "Scope: Java backend only"
        echo "Protected services: AI Service (Port 8000), ML Service (Port 8001)"
        echo "Action required: Review deployment logs and fix issues before next deployment"
        echo ""
        echo "Service status after rollback:"
        echo "- AI Service: Should be preserved and running"
        echo "- ML Service: Should be preserved and running"
        echo "- Java Backend: Rolled back to previous version"
        echo ""
        echo "Next steps:"
        echo "1. Check service logs for errors"
        echo "2. Verify all services are responding"
        echo "3. Fix deployment issues before retry"