name: CI Pipeline (Frontend + Backend)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create .env file with real database
        working-directory: ./backend/project
        run: |
          echo "spring.datasource.jdbc-url=${{ secrets.DB_URL }}" > .env
          echo "spring.datasource.username=${{ secrets.DB_USER }}" >> .env
          echo "spring.datasource.password=${{ secrets.DB_PASSWORD }}" >> .env
          echo "spring.datasource.driver-class-name=org.postgresql.Driver" >> .env
          echo "spring.jpa.hibernate.ddl-auto=validate" >> .env
          echo "openrouter.api.key=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "openrouter.base.url=${{ secrets.OPENROUTER_BASE_URL }}" >> .env
          echo "jwt.secret=${{ secrets.JWT_SECRET }}" >> .env

      - name: Build and Test Backend
        working-directory: ./backend/project
        run: |
          mvn -B clean install
          mvn -B test
          mvn -B jacoco:report

      - name: Lint Backend
        working-directory: ./backend/project
        run: mvn -B checkstyle:check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npx eslint .

      - name: Run Frontend Tests and Coverage
        working-directory: ./frontend
        run: npx jest --coverage
