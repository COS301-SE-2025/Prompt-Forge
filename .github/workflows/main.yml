name: CI Pipeline (Frontend + Backend)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend
        working-directory: ./backend/project
        env:
          # Override database properties for testing
          SPRING_DATASOURCE_JDBC_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          # Mock other values
          OPENROUTER_API_KEY: fake-test-key
          OPENROUTER_BASE_URL: https://mock-api.com
          JWT_SECRET: dGVzdC1zZWNyZXQ=
        run: |
          mvn -B clean install
          mvn -B test
          mvn -B jacoco:report

      - name: Lint Backend
        working-directory: ./backend/project
        run: mvn -B checkstyle:check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npx eslint .

      - name: Run Frontend Tests and Coverage
        working-directory: ./frontend
        run: npx jest --coverage
