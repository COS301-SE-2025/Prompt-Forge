name: CI Pipeline (Frontend + Backend)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Shared Setup
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # Backend (Java/Spring Boot)
      # ----------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend
        working-directory: ./backend/project  # Added working-directory for consistency
        run: mvn -B clean test jacoco:report  # Single command for tests + coverage

      # ----------------------------
      # Frontend (React/TypeScript)
      # ----------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: ./frontend  # Critical!
        run: npm ci

      - name: Run Jest coverage
        working-directory: ./frontend
        run: npx jest --coverage --coverageReporters=json-summary lcov

      # ----------------------------
      # Upload to Codecov
      # ----------------------------
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: |
            frontend/coverage/lcov.info
            backend/project/target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}  # Only needed for private repos
          flags: frontend,backend  # Optional: label coverage by component

      # ----------------------------
      # Linting (Optional)
      # ----------------------------
      - name: Lint Backend
        working-directory: ./backend/project  # Added working-directory
        run: mvn -B checkstyle:check
