name: CI Pipeline (Frontend + Backend)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend (Java/Spring Boot)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend
        working-directory: ./backend/project
        run: |
          mvn -B clean install
          mvn -B test
          mvn -B jacoco:report

      - name: Lint Backend
        working-directory: ./backend/project
        run: mvn -B checkstyle:check

      # Frontend (React/TypeScript)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npx eslint .

      - name: Run Frontend Tests and Coverage
        working-directory: ./frontend
        run: npx jest --coverage
