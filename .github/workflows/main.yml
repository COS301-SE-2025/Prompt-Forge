name: CI Pipeline (Frontend + Backend)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Create .env file with test values
      - name: Create .env file for testing
        working-directory: ./backend/project
        run: |
          echo "spring.datasource.jdbc-url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1" > .env
          echo "spring.datasource.username=sa" >> .env
          echo "spring.datasource.password=" >> .env
          echo "spring.datasource.driver-class-name=org.h2.Driver" >> .env
          echo "openrouter.api.key=fake-test-key" >> .env
          echo "openrouter.base.url=https://mock-api.com" >> .env
          echo "jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHk=" >> .env

      - name: Build and Test Backend
        working-directory: ./backend/project
        run: |
          mvn -B clean install
          mvn -B test
          mvn -B jacoco:report

      - name: Lint Backend
        working-directory: ./backend/project
        run: mvn -B checkstyle:check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npx eslint .

      - name: Run Frontend Tests and Coverage
        working-directory: ./frontend
        run: npx jest --coverage
